# AI Foundations | AI Organizational Integration
# 01 — Operator Input Specification
# Source-line: Alyssa Solen → AI Foundations → Origin | Continuum
#
# HOW TO USE THIS FILE
#
# Copy this ENTIRE file and paste it into the AI.
#
# INSTRUCTIONS TO THE AI
# When this file is pasted to you, run the intake for the operator.
#
# 1. Tell the operator you will guide them through Step 01.
# 2. Ask for the missing organization- and system-specific information ONE QUESTION AT A TIME.
# 3. Use plain language. The operator should not need to understand YAML, grading, or framework logic.
# 4. Do not invent organization-specific facts.
# 5. If the operator does not know an answer, record UNKNOWN.
# 6. For YES/NO capability questions, convert the operator's answer to true or false. If they do not know, record UNKNOWN.
# 7. Continue until every field below has a factual value, false/true value, empty list only when the operator explicitly says NONE, or UNKNOWN.
# 8. When intake is complete, return the FULL completed YAML in one YAML code block without changing field names or framework source.
# 9. Do not ask the operator to edit YAML themselves.
# 10. After the completed YAML code block, say exactly:
#
#     Step 01 is complete. Copy the completed YAML above.
#     Next, give the AI these FOUR items together:
#     1. your completed 01_ORGANIZATIONAL_AI_INTEGRATION_SPEC.yaml
#     2. 02_ASSESSMENT_RULES.yaml
#     3. 03_ORGANIZATIONAL_AI_INTEGRATION_RECORD_TEMPLATE.md
#     4. 04_RUN_ASSESSMENT.md
#     Step 04 will run the assessment for you. You do not grade or fill anything yourself.
#
# OPERATOR RESPONSIBILITY
# The operator is the factual source for organization-specific information.
# The AI guides intake and structures the answers, but must not invent facts,
# permissions, controls, access, capabilities, or organization decisions.

